# Overlay for compose.test.yaml; dedicated cw-ops-eval project, never production data.
services:
  api:
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Evaluation needs explicit key injection}
      OPENAI_MODEL: gpt-4.1-mini-2025-04-14
      AI_HOSTED_ENABLED: 'true'
      OLLAMA_MODEL: qwen3:0.6b
  ollama:
    image: ollama/ollama:0.12.3@sha256:c622a7adec67cf5bd7fe1802b7e26aa583a955a54e91d132889301f50c3e0bd0
    mem_limit: 1536m
    cpus: 2.0
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '1'
      OLLAMA_CONTEXT_LENGTH: '4096'
      OLLAMA_KEEP_ALIVE: '0'
    volumes: [evaluation_models:/root/.ollama]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 5s
      retries: 20
  tests:
    environment:
      EVALUATION_RUN: 'true'
      EVALUATION_PRIOR_RESERVED_USD: ${EVALUATION_PRIOR_RESERVED_USD:-0}
    volumes: ['./local/evaluation-output:/evidence']
    command: [python, -m, evaluation.run]
volumes:
  evaluation_models:
    external: true
    name: cw-ops-local_ollama_models
