name: cw-ops-local
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &environment
    DB_HOST: db
    DB_NAME: cw_ops
    DB_USER: cw_ops
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup_local.py}
    APP_ENVIRONMENT: local
    PLATFORM_MODE: synthetic
    SIMULATOR_SECRET: ${SIMULATOR_SECRET:?Run python scripts/setup_local.py}
  networks: [internal]
  mem_limit: 384m
  cpus: 1.0
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
services:
  db:
    mem_limit: 256m
    cpus: 1.0
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: cw_ops
      POSTGRES_USER: cw_ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup_local.py}
    volumes: [database:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cw_ops -d cw_ops']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: [python, -m, app.migrate]
    depends_on:
      db: {condition: service_healthy}
  seed:
    <<: *backend
    profiles: [tools]
    environment:
      <<: *environment
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Run python scripts/setup_local.py}
    command: [python, -m, app.seed]
    depends_on:
      migrate: {condition: service_completed_successfully}
  simulator:
    <<: *backend
    command: [uvicorn, app.simulator:app, --host, 0.0.0.0, --port, '8000', --no-access-log]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=3)']
      interval: 2s
      timeout: 4s
      retries: 30
  api:
    <<: *backend
    environment:
      <<: *environment
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini-2025-04-14}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      XAI_MODEL: ${XAI_MODEL:-grok-4-fast-non-reasoning}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:0.6b}
      AI_HOSTED_ENABLED: ${AI_HOSTED_ENABLED:-false}
    ports: ['127.0.0.1:${API_PORT:-8030}:8000']
    depends_on:
      simulator: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=3)']
      interval: 5s
      timeout: 4s
      retries: 20
  worker:
    <<: *backend
    profiles: [automation]
    command: [python, -m, app.worker]
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, app.worker, --health]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
  client:
    mem_limit: 192m
    cpus: 1.0
    build:
      context: .
      dockerfile: client/Dockerfile
    profiles: [tools]
    environment:
      AI_PROVIDER: ${AI_DEFAULT_PROVIDER:-ollama}
      API_URL: http://api:8000
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Run python scripts/setup_local.py}
    networks: [internal]
    depends_on:
      api: {condition: service_healthy}
networks:
  internal: {}
volumes:
  database: {}
